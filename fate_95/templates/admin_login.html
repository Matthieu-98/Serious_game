{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>FATE_95 - Admin</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { background: #0f0f1a; color: #e0e0e0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }

        .login-card {
            background: rgba(255,255,255,0.07);
            border-radius: 18px;
            padding: 40px 44px;
            width: 340px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .hint { font-size: 0.82rem; opacity: 0.5; margin-bottom: 28px; }

        label { display: block; font-size: 0.85rem; opacity: 0.75; margin-bottom: 5px; }

        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 13px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.09); color: #fff;
            font-size: 0.95rem; box-sizing: border-box; margin-bottom: 16px;
        }

        .btn { width: 100%; padding: 11px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.18); color: #fff; font-size: 1rem;
            cursor: pointer; transition: 0.2s; }
        .btn:hover { background: rgba(255,255,255,0.28); }

        .error { background: rgba(220,60,60,0.2); border: 1px solid rgba(220,60,60,0.35);
            border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>🛠️ Administration</h1>
    <p class="hint">Compte par défaut : admin / password</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Identifiant</label>
        <input type="text" name="username" autofocus autocomplete="username">
        <label>Mot de passe</label>
        <input type="password" name="password" autocomplete="current-password">
        <button type="submit" class="btn">Connexion</button>
    </form>
</div>
</body>
</html>
