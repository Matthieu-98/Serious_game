{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>FATE_95</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background: radial-gradient(ellipse at 60% 40%, #1a1040 0%, #0a0a1a 70%);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; font-family: sans-serif; color: #e0e0e0;
        }

        .box {
            text-align: center;
            max-width: 420px;
            padding: 0 24px;
        }

        .logo { font-size: 3.5rem; margin-bottom: 6px; }
        h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: 0.05em; color: #fff; }
        .tagline { opacity: 0.55; font-size: 0.95rem; margin-bottom: 40px; }

        label { display: block; font-size: 0.85rem; opacity: 0.65; margin-bottom: 8px; text-align: left; }

        input[type="text"] {
            width: 100%; padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.09);
            color: #fff; font-size: 1.6rem;
            letter-spacing: 8px; text-align: center;
            text-transform: uppercase;
            box-sizing: border-box;
            margin-bottom: 14px;
            transition: border 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: rgba(255,255,255,0.4); }

        .btn-main {
            width: 100%; padding: 14px;
            border-radius: 12px; border: none;
            background: rgba(255,255,255,0.18);
            color: #fff; font-size: 1.05rem;
            cursor: pointer; transition: 0.2s;
            margin-bottom: 14px;
        }
        .btn-main:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

        .skip-link {
            display: block; font-size: 0.82rem; opacity: 0.45;
            color: #e0e0e0; text-decoration: none;
            transition: opacity 0.2s;
        }
        .skip-link:hover { opacity: 0.7; }

        .error {
            background: rgba(220,60,60,0.2);
            border: 1px solid rgba(220,60,60,0.35);
            border-radius: 8px; padding: 10px 14px;
            margin-bottom: 16px; font-size: 0.9rem;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">🎮</div>
    <h1>FATE_95</h1>
    <p class="tagline">Sois le maître de ton destin.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Code de session (fourni par ton conseiller)</label>
        <input type="text" name="code" placeholder="XXXXXX" maxlength="20" autofocus autocomplete="off">
        <button type="submit" class="btn-main">Rejoindre la session 🚀</button>
    </form>

    <a href="{% url 'home' %}" class="skip-link">Jouer sans code de session →</a>
</div>
</body>
</html>
