{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>FATE_95 - Quête du Peintre</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #4b2b68, #1d1230);
            overflow: hidden;
        }

        .painter-scene {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
        }

        .center-text h1 {
            font-size: 3.2rem;
            margin: 0 0 12px;
        }

        .center-text p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .pentagon-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .pentagon-lines svg {
            width: 100%;
            height: 100%;
        }

        .pentagon-lines line {
            stroke: rgba(255,255,255,0.65);
            stroke-width: 4;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
        }

        .color-btn {
            position: absolute;
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.7);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 12px 28px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 2;
        }

        .color-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 16px 34px rgba(0,0,0,0.45);
        }

        .color-icon {
            display: block;
            font-size: 2.3rem;
            margin-bottom: 8px;
        }

        .bleu {
            background: linear-gradient(135deg, #1e88e5, #0d47a1);
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
        }

        .jaune {
            background: linear-gradient(135deg, #ffd54f, #f9a825);
            color: #2d2300;
            top: 32%;
            right: 13%;
        }

        .rouge {
            background: linear-gradient(135deg, #ff5252, #b71c1c);
            bottom: 9%;
            right: 23%;
        }

        .noir {
            background: linear-gradient(135deg, #424242, #000000);
            bottom: 9%;
            left: 23%;
        }

        .blanc {
            background: linear-gradient(135deg, #ffffff, #d7d7d7);
            color: #222;
            top: 32%;
            left: 13%;
        }

        @media (max-width: 800px) {
            body {
                overflow-y: auto;
            }

            .painter-scene {
                height: auto;
                min-height: 100vh;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .pentagon-lines {
                display: none;
            }

            .center-text {
                position: static;
                transform: none;
                margin-bottom: 30px;
            }

            .color-btn {
                position: static;
                width: 160px;
                height: 160px;
                margin: 12px auto;
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <form method="POST" class="painter-scene">
        {% csrf_token %}

        <div class="pentagon-lines">
            <svg viewBox="0 0 1000 800" preserveAspectRatio="none">
                <line x1="500" y1="105" x2="820" y2="315"></line>
                <line x1="820" y1="315" x2="705" y2="690"></line>
                <line x1="705" y1="690" x2="295" y2="690"></line>
                <line x1="295" y1="690" x2="180" y2="315"></line>
                <line x1="180" y1="315" x2="500" y2="105"></line>
            </svg>
        </div>

        <div class="center-text">
            <h1>🎨 Quête du Peintre</h1>
            <p>Choisis la couleur qui t’attire le plus.</p>
        </div>

        <button type="submit" class="color-btn bleu" name="color" value="bleu">
            <span class="color-icon">🔵</span>
            Bleu
        </button>

        <button type="submit" class="color-btn jaune" name="color" value="jaune">
            <span class="color-icon">🟡</span>
            Jaune
        </button>

        <button type="submit" class="color-btn rouge" name="color" value="rouge">
            <span class="color-icon">🔴</span>
            Rouge
        </button>

        <button type="submit" class="color-btn noir" name="color" value="noir">
            <span class="color-icon">⚫</span>
            Noir
        </button>

        <button type="submit" class="color-btn blanc" name="color" value="blanc">
            <span class="color-icon">⚪</span>
            Blanc
        </button>
    </form>
</body>
</html>
