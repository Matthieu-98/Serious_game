<div id="chatbot">
    <button id="chatbot-toggle" type="button">
        💬
    </button>

    <div id="chatbot-window" class="chatbot-hidden">

        <div class="chatbot-header">
            <div>
                <strong>Guide FATE_95</strong>
                <small>Assistant d'orientation</small>
            </div>

            <button id="chatbot-close" type="button">
                ×
            </button>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">

            <div class="bot-message">
                Salut 👋 Je suis ton guide FATE_95.
                Tu peux me poser des questions sur ton profil,
                les métiers ou ton orientation.
            </div>

        </div>

        <form id="chatbot-form">
            {% csrf_token %}

            <textarea
                id="chatbot-input"
                name="message"
                placeholder="Pose ta question..."
                autocomplete="off"
                maxlength="1000"
                rows="1"
                required
            ></textarea>

            <button type="submit">
                Envoyer
            </button>
        </form>

        <div class="chatbot-input-hint">
            Entrée pour envoyer • Shift + Entrée pour aller à la ligne
        </div>

    </div>
</div>
